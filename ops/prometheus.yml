global: {scrape_interval: 5s}
scrape_configs:
  - job_name: api
    static_configs: [{targets: ["api:8000"]}]
  - job_name: researcher            # DNS A-record discovery returns every replica when scaled
    dns_sd_configs: [{names: ["researcher"], type: A, port: 8001, refresh_interval: 10s}]
  - job_name: assessor
    dns_sd_configs: [{names: ["assessor"], type: A, port: 8001, refresh_interval: 10s}]
  - job_name: llm-stub
    static_configs: [{targets: ["llm-stub:9000"]}]
  - job_name: cadvisor
    static_configs: [{targets: ["cadvisor:8080"]}]
