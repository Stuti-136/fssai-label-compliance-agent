# One command from a clean clone:  docker compose up --build
# Scale the research agent:         docker compose up --build --scale researcher=3
# Load test (profile):              docker compose --profile loadtest up locust
x-app: &app
  build: .
  image: fssai-label-compliance:latest
  env_file:
    - .env.example            # documented defaults
    - path: .env              # your local overrides / secrets (git-ignored)
      required: false
  restart: unless-stopped

services:
  redis:                       # queue + run store + cache + quarantine + feedback. Stateful => own container, persisted.
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}

  llm-stub:                    # stands in for the provider (default config + load tests); isolates provider rate limits
    <<: *app
    command: ["uvicorn", "llm_stub.main:app", "--host", "0.0.0.0", "--port", "9000"]
    ports: ["9000:9000"]       # published only so the breaker demo can flip the stub into failure modes
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9000/healthz',timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 10

  indexer:                     # D2 pipeline as a one-shot job; the index lives on a shared volume (independent release/rebuild)
    <<: *app
    command: ["python", "-m", "app.rag.ingest"]
    restart: "no"
    environment: {SERVICE_NAME: indexer}
    volumes: ["index_data:/data", "model_cache:/models"]

  api:                         # ingestion boundary + async submission. Light, stateless, scales on request rate.
    <<: *app
    environment: {SERVICE_NAME: api}
    ports: ["8000:8000"]
    volumes: ["index_data:/data:ro", "model_cache:/models"]
    depends_on:
      redis: {condition: service_healthy}
      indexer: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck", "api"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  streamlit:
    <<: *app
    command: ["streamlit", "run", "streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      SERVICE_NAME: streamlit
      FSSAI_API_BASE_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on:
      api: {condition: service_healthy}

  researcher:                  # agent 1. Retrieval-heavy; scale this (--scale researcher=3). No published ports.
    <<: *app
    command: ["python", "-m", "app.worker"]
    environment: {SERVICE_NAME: researcher, WORKER_ROLE: researcher}
    volumes: ["index_data:/data:ro", "model_cache:/models"]
    depends_on:
      redis: {condition: service_healthy}
      indexer: {condition: service_completed_successfully}
      llm-stub: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck", "worker:researcher"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 40s

  assessor:                    # agent 2. Separate failure domain and release cadence from the researcher.
    <<: *app
    command: ["python", "-m", "app.worker"]
    environment: {SERVICE_NAME: assessor, WORKER_ROLE: assessor}
    volumes: ["index_data:/data:ro", "model_cache:/models"]
    depends_on:
      redis: {condition: service_healthy}
      indexer: {condition: service_completed_successfully}
      llm-stub: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck", "worker:assessor"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 40s

  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment: {COLLECTOR_OTLP_ENABLED: "true"}
    ports: ["16686:16686"]

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes: ["./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    healthcheck: {test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"], interval: 10s, timeout: 3s, retries: 6}

  cadvisor:                    # per-container CPU / memory / uptime for the dashboard (Linux hosts; limited on Docker Desktop)
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    volumes: ["/:/rootfs:ro", "/var/run:/var/run:ro", "/sys:/sys:ro", "/var/lib/docker/:/var/lib/docker:ro"]
    privileged: true

  grafana:
    image: grafana/grafana:11.1.0
    environment: {GF_AUTH_ANONYMOUS_ENABLED: "true", GF_AUTH_ANONYMOUS_ORG_ROLE: Admin, GF_AUTH_DISABLE_LOGIN_FORM: "true"}
    volumes: ["./ops/grafana/provisioning:/etc/grafana/provisioning:ro", "./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro"]
    ports: ["3000:3000"]
    depends_on: [prometheus]
    healthcheck: {test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"], interval: 10s, timeout: 3s, retries: 6}

  locust:
    <<: *app
    profiles: ["loadtest"]
    command: ["locust", "-f", "loadtest/locustfile.py", "--host", "http://api:8000", "--web-host", "0.0.0.0"]
    ports: ["8089:8089"]
    depends_on: {api: {condition: service_healthy}}

volumes: {redis_data: {}, index_data: {}, model_cache: {}}
